<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シーズンショップ計算機 | ザ・アンツ攻略</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="shop.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <div class="container">

    <header class="page-header">
      <p class="eyebrow">ザ・アンツ攻略ツール</p>
      <h1 class="title">🛒 シーズンショップ<br>シミュレーター</h1>
      <p class="lead">シーズンポイントで何を買うか計画しよう。</p>
    </header>

    <nav class="page-nav">
      <a href="index.html" class="nav-link">← 素材計算機へ</a>
    </nav>

    <section class="card">
      <h2 class="card-title">所持シーズンポイント</h2>
      <div class="field">
        <label for="budget">シーズンポイント</label>
        <input
          type="number"
          id="budget"
          inputmode="numeric"
          min="0"
          placeholder="例：10000"
        />
        <p class="hint">今持っているシーズンポイントの合計を入力してください</p>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">アイテム一覧</h2>
      <p class="hint shop-hint">価格は実際のゲームに合わせて変更できます</p>
      <div id="itemList"></div>
    </section>

    <section class="card" id="cartSection" hidden>
      <h2 class="card-title">🛒 カート</h2>
      <div id="cartItems"></div>
      <div id="cartSummary" class="cart-summary"></div>
    </section>

    <footer class="page-footer">
      <p>ザ・アンツ攻略サイト</p>
    </footer>

  </div>

  <script src="shop.js"></script>
</body>
</html>
